<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabacomyu</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #000;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            height: 100vh;
            font-family: 'VT323', monospace;
            color: #fff;
        }

        #canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            width: 100vw; height: 100vh;
            display: block;
            position: absolute; top: 0; left: 0; z-index: 1;
            cursor: pointer;
        }

        .ui-layer {
            position: relative; z-index: 10;
            width: 100%; height: 100%;
            pointer-events: none;
        }

        #timer {
            position: absolute; top: 20px; left: 50%;
            transform: translateX(-50%);
            font-size: 48px; color: #222;
            text-shadow: 2px 2px #000;
        }

        .controls {
            position: absolute; bottom: 40px; left: 50%;
            transform: translateX(-50%);
            display: flex; align-items: center;
            background: #000;
            padding: 4px;
            border: 4px solid #fff;
            box-shadow: 0 0 0 4px #000;
            pointer-events: auto;
        }

        input[type=text] {
            background: #000; border: none; color: #fff;
            font-family: 'VT323', monospace; font-size: 20px;
            padding: 8px 15px; outline: none; width: 280px;
        }

        button {
            background: #fff; border: none; color: #000;
            font-family: 'VT323', monospace; font-size: 18px;
            font-weight: bold; padding: 8px 20px; cursor: pointer;
        }
    </style>
</head>
<body>

    <canvas id="canvas" width="480" height="270"></canvas>

    <div class="ui-layer">
        <div id="timer">05:00</div>
        <div class="controls">
            <input type="text" id="msgInput" placeholder="SAY SOMETHING..." maxlength="20" autocomplete="off">
            <button id="sendBtn">SEND</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const timerText = document.getElementById('timer');

        ctx.imageSmoothingEnabled = false;

        let messages = [];
        let bgSmokes = [];
        let fallingAshes = [];

        const TOTAL_TIME = 5 * 60 * 1000;
        const startTime = Date.now();
        const FIXED_FONT_SIZE = 14;

        let isInhaling = false; // 흡입 중 여부
        let inhaleTimer = 0;

        const CIG = {
            baseY: canvas.height - 20,
            fullLen: 100,
            filterLen: 25,
            pSize: 6,
            lastAshFallLen: 0
        };

        class FallingAsh {
            constructor(x, y) {
                this.x = x + (Math.random() - 0.5) * 6;
                this.y = y;
                this.size = 1 + Math.random() * 3;
                this.vy = 0.2;
                this.vx = (Math.random() - 0.5) * 1.5;
                this.opacity = 1.0;
            }
            update() {
                this.vy += 0.08;
                this.y += this.vy;
                this.x += this.vx;
                this.opacity -= 0.02;
                return this.y < canvas.height && this.opacity > 0;
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.fillStyle = "#444";
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        class MessageSmoke {
            constructor(text, x, y) {
                this.text = text; // 대문자 변환 삭제
                this.x = x; this.y = y;
                this.startTime = Date.now();
                this.lifeTime = 5000;
                this.vx = (Math.random() - 0.5) * 0.4;
                this.vy = -0.6;
            }
            update() {
                const age = Date.now() - this.startTime;
                this.progress = age / this.lifeTime;
                this.x += Math.sin(age * 0.005) * 0.2 + this.vx;
                this.y += this.vy;
                return this.progress < 1;
            }
            draw() {
                ctx.save();
                let alpha = (this.progress > 0.6) ? 1 - ((this.progress - 0.6) / 0.4) : 1;
                ctx.globalAlpha = Math.max(alpha, 0);
                ctx.fillStyle = "#FFFFFF";
                ctx.font = `${FIXED_FONT_SIZE}px 'VT323'`;
                ctx.textAlign = "center";
                ctx.fillText(this.text, Math.floor(this.x), Math.floor(this.y));
                ctx.restore();
            }
        }

        class BackgroundSmoke {
            constructor(x, y, isDense = false) {
                this.x = x; this.y = y;
                this.startTime = Date.now();
                this.lifeTime = isDense ? 4000 : 8000;
                this.size = isDense ? 8 + Math.random()*10 : 4 + Math.random()*6;
                this.vx = (Math.random() - 0.5) * 0.5;
                this.vy = isDense ? -1.2 : -0.3;
                this.alphaMax = isDense ? 0.6 : 0.2;
            }
            update() {
                const age = Date.now() - this.startTime;
                this.progress = age / this.lifeTime;
                this.y += this.vy;
                this.x += this.vx;
                return this.progress < 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alphaMax * (1 - this.progress);
                ctx.fillStyle = "#888";
                ctx.beginPath();
                ctx.arc(Math.floor(this.x), Math.floor(this.y), this.size * (1 + this.progress), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 상호작용 이벤트 ---
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            const centerX = canvas.width / 2;
            const elapsed = Date.now() - startTime;
            const ratio = Math.min(elapsed / TOTAL_TIME, 1);
            const burnLen = (CIG.fullLen - CIG.filterLen) * ratio;
            const topY = CIG.baseY - CIG.fullLen + burnLen;

            // 1. 담배 끝(재) 클릭 시 털기
            if (Math.abs(mouseX - centerX) < 20 && Math.abs(mouseY - topY) < 30) {
                if (burnLen > CIG.lastAshFallLen) {
                    for(let i=0; i<12; i++) fallingAshes.push(new FallingAsh(centerX, topY));
                    CIG.lastAshFallLen = burnLen;
                }
            }

            // 2. 필터 부분 클릭 시 흡입 시작
            if (Math.abs(mouseX - centerX) < 15 && mouseY > CIG.baseY - CIG.filterLen - 10) {
                isInhaling = true;
            }
        });

        window.addEventListener('mouseup', () => {
            if (isInhaling) {
                // 손을 떼면 연기가 한꺼번에 나옴
                const ratio = Math.min((Date.now() - startTime) / TOTAL_TIME, 1);
                const burnLen = (CIG.fullLen - CIG.filterLen) * ratio;
                const topY = CIG.baseY - CIG.fullLen + burnLen;
                for(let i=0; i<5; i++) bgSmokes.push(new BackgroundSmoke(canvas.width / 2, topY, true));
            }
            isInhaling = false;
        });

        function render() {
            ctx.fillStyle = "#000"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            const elapsed = Date.now() - startTime;
            const remaining = Math.max(TOTAL_TIME - elapsed, 0);
            const ratio = Math.min(elapsed / TOTAL_TIME, 1);

            const m = Math.floor(remaining / 60000);
            const s = Math.floor((remaining % 60000) / 1000);
            timerText.innerText = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;

            const centerX = canvas.width / 2;
            const burnableLen = CIG.fullLen - CIG.filterLen;
            const burnLen = burnableLen * ratio;
            const currentBodyLen = burnableLen - burnLen;
            const topY = CIG.baseY - CIG.fullLen + burnLen;

            // 자동 재 떨어짐 (클릭 안 해도 너무 길어지면 낙하)
            if (burnLen - CIG.lastAshFallLen > 25) {
                for(let i=0; i<6; i++) fallingAshes.push(new FallingAsh(centerX, CIG.baseY - CIG.fullLen + CIG.lastAshFallLen));
                CIG.lastAshFallLen = burnLen;
            }

            if (remaining > 0) {
                // 매달린 재
                ctx.fillStyle = "#222";
                ctx.fillRect(centerX - (CIG.pSize/2), CIG.baseY - CIG.fullLen + CIG.lastAshFallLen, CIG.pSize, burnLen - CIG.lastAshFallLen);
                // 필터
                ctx.fillStyle = "#CD853F";
                ctx.fillRect(centerX - (CIG.pSize/2), CIG.baseY - CIG.filterLen, CIG.pSize, CIG.filterLen);
                // 몸통
                ctx.fillStyle = "#DDD";
                ctx.fillRect(centerX - (CIG.pSize/2), CIG.baseY - CIG.filterLen - currentBodyLen, CIG.pSize, currentBodyLen);

                // 불꽃 효과 (흡입 시 더 커짐)
                const fireSize = isInhaling ? CIG.pSize + 4 : CIG.pSize + 2;
                ctx.fillStyle = (Math.random() > (isInhaling ? 0.05 : 0.2)) ? "#FF4400" : "#FFCC00";
                ctx.fillRect(centerX - (fireSize/2), topY - 2, fireSize, isInhaling ? 6 : 4);
            }

            // 배열 업데이트 및 렌더링
            fallingAshes = fallingAshes.filter(a => a.update() && (a.draw() || true));
            bgSmokes = bgSmokes.filter(s => s.update() && (s.draw() || true));
            messages = messages.filter(m => m.update() && (m.draw() || true));

            requestAnimationFrame(render);
        }

        function send() {
            const val = msgInput.value.trim();
            if (val) {
                const ratio = Math.min((Date.now() - startTime) / TOTAL_TIME, 1);
                const burnLen = (CIG.fullLen - CIG.filterLen) * ratio;
                const spawnY = (CIG.baseY - CIG.fullLen + burnLen) - 10;
                messages.push(new MessageSmoke(val, canvas.width / 2, spawnY));
                msgInput.value = "";
            }
        }

        sendBtn.onclick = send;
        msgInput.onkeypress = (e) => { if(e.key === 'Enter') send(); };
        document.fonts.ready.then(render);
    </script>
</body>
</html>
