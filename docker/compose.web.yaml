services:
  web:
    image: nginx:alpine
    container_name: tabacomyu-web
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ../web_source/FE:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tabacomyu-net
    restart: unless-stopped

networks:
  tabacomyu-net:
    external: true
