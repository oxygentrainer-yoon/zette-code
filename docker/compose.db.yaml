services:
  db:
    image: postgres:16
    container_name: tabacomyu-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - tabacomyu-db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    networks:
      - tabacomyu-net
    restart: unless-stopped

volumes:
  tabacomyu-db-data:

networks:
  tabacomyu-net:
    external: true
